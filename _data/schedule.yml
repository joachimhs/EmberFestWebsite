    - time: "10:45&mdash;11:15"
      label: "Guardrails by Design: Frontend Reliability in an Agentic World"
      description: >
        <p>With tools like Claude Code and Copilot now writing significant chunks of our Ember components and templates, how do we make sure we aren't just shipping bugs faster?</p>
        <p>In this talk, I’ll share how we can keep our Ember apps stable when we’re leaning on AI to help us code. We’ll look at practical ways to wrap our agent-assisted workflows in solid "guardrails" — specifically focusing on how to level up our automated testing. We’ll walk through:</p>
        <p>
          • Coverage that counts: Moving beyond raw lines of code to testing actual component behaviour.<br />
          • Visual Regression: Automating the "eye test" to catch UI shifts before they reach the browser.<br />
          • Custom Linting: Using custom ESLint rules to bake our team’s Ember conventions directly into the AI’s workflow.<br />
        </p>
        <p>If you’re worried about AI making a mess of your codebase, come by to swap stories and pick up some patterns for keeping our Ember apps as reliable as ever.</p>
      speakers:
        - name: "David McNamara"
          image: "/images/speakers/davic-mcnamara.jpeg"
          url: "https://www.linkedin.com/in/dmcnamara-eng"

    - time: "11:30&mdash;12:00"
      label: "Background Scripts and Foreground Hamsters"
      description: >
        <p>In this talk, I'll tell you more about my experience as an Ember developer who wanted to create a browser extension.</p>
        <p>We'll take a look at how I used broccoli 🥦 to build my extension for Chrome and how I switched to vite with plugins to target all the browsers...</p>
      speakers:
        - name: "Karel Bousson"
          image: "/images/speakers/karel-bousson.jpeg"
          url: "https://www.linkedin.com/in/karelbousson"

    - time: "12:00&mdash;13:30"
      label: "Lunch"

    - time: "13:30&mdash;14:00"
      label: "Peering Into the Void: the Joys and Perils of Dependency Resolution"
      description: >
        <p>Dependency resolution in node projects is a complex beast at the best of times. Peer dependencies, competing module standards, bundlers and transpilers can seriously muddy the waters. Things can get especially hairy during addon development, where you'd like your app to resolve your local version.</p>
        <p>In this talk we'll try to build an intuition for what is going on underneath, so that we can understand why things go wrong.</p>
      speakers:
        - name: "Arne Bertrand"
          image: "/images/speakers/arne-bertrand.png"
          github: "https://github.com/abeforgit"
          url: "https://redpencil.io/"
          bio: >
            <p>After a brief stint in corporate finance, I was lucky to discover my true passion and able to make a full career switch to software development. I especially love building complex GUI software, as it provides a challenge right in the middle of UX design, performance-critical algorithms, and software architecture.</p>

