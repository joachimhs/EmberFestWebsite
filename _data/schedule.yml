    - time: "10:45&mdash;11:15"
      label: "Modernizing the Ember Router: How to swap the steering wheel while driving"
      description: >
        <p>When Ember introduced its router over a decade ago, it was one of the best in the JavaScript ecosystem. Today, it's showing its age. Limitations, quirks, and patterns that no longer match how we want to build apps. But you can't just rip out the router of a framework that powers thousands of production applications. This talk introduces the Route Manager: a new abstraction layer that lets us modernize Ember's routing concepts.</p>
      speakers:
        - name: "Nick Schot"
          image: "/images/speakers/nick-schot.webp"
          twitter: "nickschot"
          url: "https://nickschot.nl/"
          bio: >
            <p>Long time Ember.js developer from The Netherlands. Working at Mainmatter. Always interested in anything involving a lot of tinkering including but not limited to: animations, model railways, micro controllers & coffee.</p>

    - time: "11:30&mdash;12:00"
      label: "Hamster in Harness"
      description: >
        <p>As agentic engineering accelerates code generation, validation needs to keep up. The solution isn't new — it's the engineering culture, tooling, and infrastructure we've pushed for years, now called Harness Engineering. This talk explores what a good Ember harness looks like in practice.</p>
      speakers:
        - name: "Marco Otte-Witte"
          image: "/images/speakers/marco-otte-witte.jpeg"
          twitter: "marcoow"
          url: "https://www.linkedin.com/in/marco-otte-witte"
          bio: >
            <p>Marco has been working in web engineering for about 15 years and has used all kinds of technologies in projects of all kinds of sizes. His company Mainmatter offers custom development, team augmentation, and mentoring. He has worked with Ember for many years and is the original author of ember-simple-auth.</p>

    - time: "12:00&mdash;13:30"
      label: "Lunch"

    - time: "13:30&mdash;14:00"
      label: "4,207 Days of Uptime: Evolving an Ember App Without a Rewrite"
      description: >
        <p>What does it take to keep an Ember app alive and evolving for over a decade?</p>
        <p>This talk follows a real-world project that started on Ember 1.11 and is still running today on Ember 6.9, spanning 4,207 days of continuous development without a full rewrite.</p>
        <p>Rather than presenting an idealized migration path, this talk focuses on the messy reality: incremental upgrades, dead ends, partial migrations, and legacy code that continues to coexist with modern patterns. It also looks at how teams make decisions when multiple paradigms live side by side in the same codebase.</p>
        <p>If you’re maintaining a long-lived Ember app, or wondering whether you should rewrite yours, this talk offers a pragmatic perspective on how to evolve a codebase across multiple generations of framework ideas without starting from scratch.</p>
      speakers:
        - name: "Michal Bryxi"
          image: "/images/speakers/michal-bryxi.jpeg"
          mastodon: "https://mastodon.world/@MichalBryxi"

    - time: "14:15&mdash;14:45"
      label: "Both Sides of the Table: What Tech Interviews Should Actually Look Like"
      description: >
        <p>Tech interviews are often treated like exams: a candidate sweats through a 30-minute coding challenge while someone watches silently, takes notes, and decides their fate. But interviews aren’t exams — they’re conversations. And the way a company runs its interview process tells you just as much about them as it tells them about you.</p>
        <p>In this talk, I’ll share what I’ve learned from being on both sides of the table: from designing a hiring process as a solo frontend developer looking for my first peer, to interviewing senior candidates today. We’ll talk about why “I don’t know” is one of the most powerful answers a candidate can give, why how you say something often matters more than what you say, why a rejection is rarely a verdict on your worth as an engineer, and why interviewers carry the responsibility of making the room feel safe.</p>
        <p>Whether you’re preparing for your next interview, running them at your company, or just tired of the broken patterns the industry keeps repeating, you’ll leave with a clearer idea of what a good interview looks like — and the red flags that should send you running.</p>
      speakers:
        - name: "Luis Lorente"
          image: "/images/speakers/luis-lorente.jpeg"
          url: "https://www.linkedin.com/in/luislorenteruiz/"

    - time: "15:00&mdash;15:30"
      label: "How complicated could a table be? A deep dive on the Helios AdvancedTable component"
      description: >
        <p>Tables, data grids, headless tables, kitchen tables… Just how many tables are there? Why is it so hard to style tables with CSS? Should you try to recreate Excel in a component? How many features can a table have and still be accessible? Tables are a foundation on the web. In technical, data-dense products like HashiCorp’s, they are mission-critical UIs. On the Helios Design Systems Team, we saw a growing demand for advanced functionality in our Table component. This kicked off a deeper exploration into what a table really is, ultimately leading to the creation of our new Advanced Table. The Advanced Table supports powerful features like resizable columns, keyboard navigation, and expandable rows—designed to be accessible from the beginning. In this talk, I’ll share how we approached the Advanced Table, what we learned, and how it is helping users get more value from their data.</p>
      speakers:
        - name: "Lee White"
          image: "/images/speakers/lee-white.jpg"
          bio: >
            <p>Lee is a Senior UX Engineer at HashiCorp/IBM, where she helps build the Helios Design System. She is passionate about scaling accessibility through design systems.</p>

    - time: "15:30&mdash;16:00"
      label: "Snack break"

    - time: "16:00&mdash;16:30"
      label: "Agent-assisted Coding with Ember at Enterprise Scale"
      description: >
        <p>As agent-assisted coding gained momentum at Addepar, we were faced with a challenge: how do we get agents to build with modern Ember standards when our codebase contains so many outdated patterns? While Ember’s commitment to backwards compatibility and clear upgrade paths is a gift to humans, it also can be extremely confusing for autonomous agents. I’ll share the real-world steps we’ve taken to infuse guardrails into our 14 year old, 1.5 million line Ember codebase to make coding agents more productive, keep code quality high, and accelerate the modernization of our Ember enterprise monolith. Might we improve the codebase for human engineers in the process?</p>
      speakers:
        - name: "Kevin Pfefferle"
          image: "/images/speakers/kevin-pfefferle.jpg"
          url: "https://www.linkedin.com/in/kevinpfefferle/"

    - time: "16:45&mdash;17:15"
      label: "Workshopping Ember with Storybook"
      speakers:
        - name: "Thomas Gossmann"
          image: "/images/speakers/thomas-gossmann.jpeg"
          url: "https://gos.si/"
          twitter: "unistyler"
          bio: >
            <p>Unicyclist. Artist. Developer.</p>

